<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15275a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wasteless">
  <title>Wasteless · Учёт пищевых отходов</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <script>
    // SDK Telegram грузим только при запуске из бота (?tg=1), чтобы обычный сайт не зависел от telegram.org
    if (/[?&]tg=1/.test(location.search)) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
  </script>
  <script>
    // внутри Telegram: разворачиваем на весь экран и красим шапку в цвет бренда
    (function () { var tg = window.Telegram && window.Telegram.WebApp; if (!tg || !tg.initData) return;
      document.documentElement.classList.add('in-tg'); tg.ready(); tg.expand();
      try { tg.setHeaderColor('#15275a'); tg.setBackgroundColor('#f4f6fa'); } catch (e) {}
      // Telegram кладёт служебные параметры в #hash — возвращаем адрес нашего роутера
      if (/tgWebApp/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search + '#/me'); })();
  </script>
  <script src="vendor/chart.js"></script>
  <script src="vendor/anime.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
